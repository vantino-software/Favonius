name: Release

# Builds binaries and attaches them to the GitHub release when a version
# tag is pushed. Nothing here runs on ordinary commits.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Only the two binaries a user needs. The rest of the workspace is
      # libraries they get by depending on the crates.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ahp-cli -p ahp-daemon

      # MIT, the BSD family, ISC and Unicode-3.0 all condition redistribution
      # on reproducing their notices. Shipping only our own LICENSE and
      # NOTICE does not satisfy them, and THIRD-PARTY.md does not either --
      # it lists licence *names*, not the texts the licences require. This
      # emits the texts for exactly what is linked into this target's
      # binaries, and fails the job rather than write an empty file.
      - name: Generate third-party licence notices
        run: python3 packaging/gen-attribution.py ${{ matrix.target }} THIRD-PARTY-LICENSES.md

      - name: Package
        run: |
          d=favonius-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$d"
          cp target/${{ matrix.target }}/release/favonius "$d"/
          cp target/${{ matrix.target }}/release/favonius-daemon "$d"/
          # `fvn` is an alias, not a second binary: a relative symlink, so it
          # resolves wherever the directory is unpacked and costs no extra
          # compile time or bytes. Both release targets are Linux and tar
          # stores symlinks as symlinks, so it survives the round trip.
          ln -s favonius "$d"/fvn
          cp README.md LICENSE NOTICE SECURITY.md CHANGELOG.md "$d"/
          cp THIRD-PARTY-LICENSES.md "$d"/
          cp packaging/favonius-daemon.service "$d"/
          tar czf "$d".tar.gz "$d"
          sha256sum "$d".tar.gz > "$d".tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: favonius-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          body: |
            See [CHANGELOG.md](https://github.com/vantino-software/Favonius/blob/main/CHANGELOG.md).

            Verify a download:

                sha256sum -c favonius-<version>-<target>.tar.gz.sha256

            These binaries are unsigned. Favonius has not been security
            audited — see SECURITY.md.
