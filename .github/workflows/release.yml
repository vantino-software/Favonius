name: Release

# Builds binaries and attaches them to the GitHub release when a version
# tag is pushed. Nothing here runs on ordinary commits.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # macOS and Windows build on their own runners rather than by
          # cross-compiling. `ring` and `blake3` compile C and assembly, so
          # each target needs a C toolchain for *that* target — a Linux host
          # feeds them its own `cc`, which does not understand
          # `-mmacosx-version-min` or `/arch:AVX512`. Cross-compiling all of
          # this from one box does not work, and finding that out at release
          # time is expensive.
          # The same labels the `cross-platform` job in favonius.yml uses,
          # and pinned for the same reason it pins them: `macos-13` was
          # retired on 2025-12-04, and a job naming a label that no longer
          # resolves does not fail — it queues, for ever, reporting nothing.
          # Three real failures once sat behind that for fourteen hours.
          # `macos-latest` would move under us the same way.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel     # the last x86_64 image; retires autumn 2027
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A Rust target triple names a vendor, and for most platforms that
      # vendor is literally `unknown` — so a download was called
      # `x86_64-unknown-linux-gnu`, which tells somebody choosing a file that
      # nobody knows who made it. The triple is what the compiler needs; the
      # file name is what a person reads.
      - name: Name this platform the way a person would
        id: platform
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)   name=x86_64-linux    ;;
            aarch64-unknown-linux-gnu)  name=aarch64-linux   ;;
            x86_64-pc-windows-msvc)     name=x86_64-windows  ;;
            aarch64-apple-darwin)       name=aarch64-macos   ;;
            x86_64-apple-darwin)        name=x86_64-macos    ;;
            # A target nobody has named keeps its triple rather than being
            # guessed at: a wrong name on a binary is worse than an ugly one.
            *)                          name="${{ matrix.target }}" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Only the two binaries a user needs. The rest of the workspace is
      # libraries they get by depending on the crates.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ahp-cli -p ahp-daemon

      # MIT, the BSD family, ISC and Unicode-3.0 all condition redistribution
      # on reproducing their notices. Shipping only our own LICENSE and
      # NOTICE does not satisfy them, and THIRD-PARTY.md does not either --
      # it lists licence *names*, not the texts the licences require. This
      # emits the texts for exactly what is linked into this target's
      # binaries, and fails the job rather than write an empty file.
      - name: Generate third-party licence notices
        shell: bash
        run: python3 packaging/gen-attribution.py ${{ matrix.target }} THIRD-PARTY-LICENSES.md

      # `shell: bash` on every runner, Windows included: GitHub's Windows
      # image ships Git Bash, and one packaging script that works everywhere
      # is worth more than three that drift.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          d=favonius-${{ github.ref_name }}-${{ steps.platform.outputs.name }}
          exe=""
          case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          mkdir -p "$d"
          cp "target/${{ matrix.target }}/release/favonius$exe" "$d"/
          cp "target/${{ matrix.target }}/release/favonius-daemon$exe" "$d"/
          # `fvn` is an alias, not a second binary: a relative symlink, so it
          # resolves wherever the directory is unpacked and costs no extra
          # compile time or bytes. Unix only — creating a symlink on Windows
          # needs a privilege the runner does not have, and a copy would be a
          # second megabyte pretending to be an alias. Windows users get
          # `favonius.exe`.
          case "${{ matrix.target }}" in
            *windows*) : ;;
            *) ln -s favonius "$d"/fvn ;;
          esac
          cp README.md LICENSE NOTICE SECURITY.md CHANGELOG.md "$d"/
          cp THIRD-PARTY-LICENSES.md "$d"/
          # A systemd unit is meaningless off Linux, and shipping one is a
          # small lie about what this platform's install looks like.
          case "${{ matrix.target }}" in
            *linux*) cp packaging/favonius-daemon.service "$d"/ ;;
          esac
          tar czf "$d".tar.gz "$d"
          # macOS has `shasum`, Linux and Git Bash have `sha256sum`, and
          # neither has both.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$d".tar.gz > "$d".tar.gz.sha256
          else
            shasum -a 256 "$d".tar.gz > "$d".tar.gz.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: favonius-${{ steps.platform.outputs.name }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only for a tag. `workflow_dispatch` exists to prove the matrix builds —
    # five targets, three operating systems, and the first run of any of them
    # is the one that finds the packaging assumption nobody noticed. Attaching
    # that to a release would publish something nobody asked to publish, named
    # after a branch. A dispatch leaves its artefacts on the run and nothing
    # else.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          body: |
            See [CHANGELOG.md](https://github.com/vantino-software/Favonius/blob/main/CHANGELOG.md).

            Verify a download:

                sha256sum -c favonius-<version>-<platform>.tar.gz.sha256

            These binaries are unsigned. Favonius has not been security
            audited — see SECURITY.md.
