[workspace]
resolver = "2"
members = [
    "crates/ahp-proto",
    "crates/ahp-crypto",
    "crates/ahp-sync",
    "crates/ahp-congestion",
    "crates/ahp-compression",
    "crates/ahp-daemon",
    "crates/ahp-policy",
    "crates/ahp-cli",
    "crates/ahp-api",
    "crates/ahp-observability",
    "crates/ahp-xdp",
    "crates/ahp-platform-net",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Vantino SàRL"]
repository = "https://github.com/vantino-software/Favonius"
rust-version = "1.87"

[workspace.dependencies]
# Protocol
ahp-proto = { path = "crates/ahp-proto" }
ahp-crypto = { path = "crates/ahp-crypto" }
ahp-sync = { path = "crates/ahp-sync" }
ahp-congestion = { path = "crates/ahp-congestion" }
ahp-compression = { path = "crates/ahp-compression" }
ahp-daemon = { path = "crates/ahp-daemon" }
ahp-policy = { path = "crates/ahp-policy" }
ahp-cli = { path = "crates/ahp-cli" }
ahp-api = { path = "crates/ahp-api" }
ahp-observability = { path = "crates/ahp-observability" }
ahp-xdp = { path = "crates/ahp-xdp" }
ahp-platform-net = { path = "crates/ahp-platform-net" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"

# Compression
zstd = "0.13"

# Hashing / CRC
crc32c = "0.6"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# CLI
clap = { version = "4", features = ["derive"] }

# Web / API
axum = "0.7"

# Memory-mapped I/O
memmap2 = "0.9"

# Utilities
bytes = "1"
socket2 = "0.5"
nix = { version = "0.29", features = ["net", "uio"] }
bitflags = "2"
uuid = { version = "1", features = ["v4"] }
